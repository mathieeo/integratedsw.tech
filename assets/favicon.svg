<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The site's .mark, as a real icon: the developer-instrument teal gradient
       tile (110deg, matching --grad in style.css), an "i" drawn as geometry so
       no font is needed, and the dot in the brand amber (--c2) — the same
       amber the mark glows with on the page. -->
  <defs>
    <linearGradient id="g" x1="6%" y1="32%" x2="94%" y2="68%">
      <stop offset="0" stop-color="#33e6d1"/>
      <stop offset=".55" stop-color="#6ef2e0"/>
      <stop offset="1" stop-color="#248c85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#g)"/>
  <rect width="100" height="100" rx="24" fill="url(#sheen)"/>
  <!-- the i -->
  <circle cx="50" cy="29" r="9" fill="#fab84d"/>
  <rect x="41.5" y="44" width="17" height="34" rx="8.5" fill="#0b0b12"/>
</svg>
